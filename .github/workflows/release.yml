name: Build and publish BRAT release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  release:
    name: Create BRAT release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Verify release version
        run: |
          node -e "const fs=require('fs'); const tag=process.env.GITHUB_REF_NAME; for (const file of ['manifest.json','manifest-beta.json']) { const version=JSON.parse(fs.readFileSync(file)).version; if (version !== tag) throw new Error(file + ' version ' + version + ' does not match tag ' + tag); }"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/main.js
            dist/styles.css
            dist/manifest.json
          prerelease: true
